name: Bootstrap Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/bootstrap-smoke.yml"
      - ".just/**"
      - "justfile"
      - "scripts/test-bootstrap-smoke.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-smoke.yml"
      - ".just/**"
      - "justfile"
      - "scripts/test-bootstrap-smoke.sh"

jobs:
  bootstrap-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Run bootstrap smoke test
        run: just test-bootstrap-smoke
